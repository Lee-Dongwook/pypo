name: pypo 작업
description: pypo(AI 동료)가 가져갈 작은 작업. 파일 1~3개 범위로 씁니다.
title: "[pypo] "
labels: ["bot-ready"]
body:
  - type: markdown
    attributes:
      value: |
        pypo는 이 이슈에 적힌 내용과 파일만 보고 일합니다. 모호하면 질문을 남기고 건너뜁니다.
        아직 준비가 안 됐다면 `bot-ready` 라벨을 떼 두세요.
  - type: input
    id: goal
    attributes:
      label: 목표
      description: 한 문장으로.
      placeholder: plan_allocation이 실적 미입력 카드를 거절한다
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 수정할 파일
      description: 한 줄에 하나, 1~3개. 새 테스트 파일(tests/test_*.py)은 적지 않아도 만들 수 있습니다.
      placeholder: |
        src/app/card/calculator.py
        tests/test_card_calculator.py
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 테스트로 확인할 수 있게 씁니다.
      placeholder: 실적이 빠진 카드를 넘기면 ValueError, 메시지에 카드 ID 포함
    validations:
      required: true
  - type: input
    id: tests
    attributes:
      label: 통과해야 할 테스트 (선택)
      placeholder: test_missing_spend_is_rejected_not_treated_as_zero
  - type: textarea
    id: out_of_scope
    attributes:
      label: 하지 않을 것
      placeholder: API 응답 형식은 바꾸지 않는다
    validations:
      required: true
