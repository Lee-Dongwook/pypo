name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pypo
          POSTGRES_PASSWORD: pypo
          POSTGRES_DB: pypo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pypo -d pypo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://pypo:pypo@localhost:5432/pypo
      NEO4J_URI: bolt://localhost:7687
      NEO4J_TEST_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Initialize Neo4j schema
        run: uv run python -m scripts.neo4j.init

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check for model/migration drift
        run: uv run alembic check
