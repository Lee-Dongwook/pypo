[project]
name = "pypo"
version = "0.1.0"
description = "pypo"
readme = "README.md"
requires-python = ">=3.13, <4.0"
dependencies = [
    "alembic>=1.20.1",
    "cachetools>=7.2.6",
    "celery>=5.6.3",
    "fastapi>=0.162.0",
    "fastmcp>=4.1.4",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langgraph>=1.2.18",
    "mcp>=2.3.0",
    "neo4j>=6.4.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "rdflib>=7.6.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlalchemy-orm>=1.2.10",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
    "typing-extensions>=4.16.0",
    "tomli-w>=1.2.0",
    "langchain-openai>=1.7.3",
    "langchain-ollama>=1.1.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a live Neo4j server (set NEO4J_TEST_URI)",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
